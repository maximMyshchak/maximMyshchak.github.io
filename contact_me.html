<!DOCTYPE html>

<!--- Accessibility: this site uses landmarks (header/nav/main/footer), a skip link, visible focus styles,
      aria-current for the active page, and WCAG AA color contrast, building on what I learned from my previous SWE internship on Accessibility design :)-->

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <link href="chat.css" rel="stylesheet">
        <script src="chat.js" defer></script>
        <script src="email-check.js" defer></script>
        <title>Contact | Maxim Myshchak</title>
        <script type="text/javascript"
                src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js">
        </script>
        <script type="text/javascript">
        (function(){
            emailjs.init({
                publicKey: "oJ-U0Iy2Tv6FI2cw-",
            });
        })();
        </script>
    <script>
        addEventListener("DOMContentLoaded", short_response_run)
            function short_response_run()
            {
                const form = document.querySelector("#contactForm");
                const submitButton = document.querySelector("#submitButton");
                const status = document.querySelector("#formStatus");

                // Listening for "submit" (not "click") lets the browser check required fields and the email format first,
                // and lets keyboard users send the form by pressing Enter
                form.addEventListener("submit", sendMessage)
                //I used "async" as there was an error message in my console that said that I need an async function
                async function sendMessage(event)
                {
                    event.preventDefault();
                    const templateParams = {
                        'name': document.querySelector("#name").value,
                        'message': document.querySelector("#message").value,
                        'email': document.querySelector("#email").value,
                    }

                    submitButton.disabled = true;
                    submitButton.textContent = "Sending…";
                    status.className = "form-status";
                    status.textContent = "Sending your message…";

                    try {
                        await emailjs.send('primary_service', 'template_ymz7rfz', templateParams);
                        // Only clear the form once the message actually sent, so nothing typed is lost on an error
                        form.reset();
                        status.className = "form-status success";
                        status.textContent = "Thank you! Your message was sent. Check your inbox for a confirmation email.";
                    }
                    catch(error){
                        console.error("Error sending email", error);
                        status.className = "form-status error";
                        status.textContent = "Sorry, your message could not be sent. Please try again, or email maxim_myshchak[at]college.harvard.edu.";
                    }
                    finally {
                        submitButton.disabled = false;
                        submitButton.textContent = "Send Message";
                    }
                }
            }
    </script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to main content</a>
        <!--Header-->
        <header class="header">
            <a class="header-left" href="index.html"><strong>Maxim Myshchak's Website</strong></a>
            <nav class="header-nav-bar" aria-label="Main">
                <a href="index.html">About</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="resume.html">Resume</a>
                <a href="contact_me.html" aria-current="page">Contact Me</a>
            </nav>
        </header>
        <!--Contact Information-->
        <main id="main" tabindex="-1" class="contact">
            <h1>Contact Maxim Myshchak</h1>
            <!-- The asterisks are hidden from screen readers (aria-hidden); the "required" attribute on each field already announces "required" -->
            <p>All fields are required. Required fields are marked with <span class="required-mark" aria-hidden="true">*</span>.</p>
            <form id="contactForm">
                <div class="padd">
                    <label for="name">Name <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="name" name="name" autocomplete="name" placeholder="John Doe" class="p-2" required autofocus>
                </div>
                <div class="padd">
                    <label for="email">Email address <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="John_Doe@gmail.com" class="p-2" required aria-describedby="email-hint">
                    <!-- Typo suggestions and errors for the email field; aria-live makes screen readers announce them -->
                    <p id="email-hint" class="field-hint" aria-live="polite"></p>
                </div>
                <div class="padd">
                    <label for="message">Message <span class="required-mark" aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="5" placeholder="This is my message" class="p-2" required></textarea>
                </div>
                <button id="submitButton" type="submit">Send Message</button>
                <!-- role="status" makes screen readers announce the sent/error message without moving focus -->
                <p id="formStatus" class="form-status" role="status"></p>
            </form>
        </main>

        <!--Footer-->
        <footer class="footer">
            <p class="footer-name">Maxim Myshchak</p>
            <p><small>Thank you for visiting my website!</small></p>
        </footer>
    </body>
</html>
