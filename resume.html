<!DOCTYPE html>

<!--- Accessibility: this site uses landmarks (header/nav/main/footer), a skip link, visible focus styles,
      aria-current for the active page, and WCAG AA color contrast, building on what I learned from my previous SWE internship on Accessibility design :)-->

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <link href="chat.css" rel="stylesheet">
        <script src="chat.js" defer></script>
        <title>Resume | Maxim Myshchak</title>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to main content</a>
        <!--Header-->
        <header class="header">
            <a class="header-left" href="index.html"><strong>Maxim Myshchak's Website</strong></a>
            <nav class="header-nav-bar" aria-label="Main">
                <a href="index.html">About</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="resume.html" aria-current="page">Resume</a>
                <a href="contact_me.html">Contact Me</a>
            </nav>
        </header>
        <!--Resume-->
        <main id="main" tabindex="-1" class="resume">
            <h1 class="page-title">Resume</h1>
            <!-- Many phones and screen readers can't use a PDF inside an iframe, so a direct link is offered too -->
            <p>
                <a href="Maxim_Myshchak_Resume.pdf" download>Download Maxim's resume (PDF, 130 KB)</a>
            </p>
            <!-- #view=FitH tells the browser's PDF viewer to fit the page width instead of shrinking the whole page into the frame -->
            <iframe src="Maxim_Myshchak_Resume.pdf#view=FitH" title="Maxim Myshchak's resume (PDF)"></iframe>
        </main>
        <!--Footer-->
        <footer class="footer">
            <p class="footer-name">Maxim Myshchak</p>
            <p><small>Thank you for visiting my website!</small></p>
        </footer>
    </body>
</html>
